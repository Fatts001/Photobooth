<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <title>Mini Battle Royale 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game"></div>

<div id="hud">
  <div class="status">
    ❤️ <span id="hp">100</span>
    <span class="kills">☠️ <span id="kills">0</span></span>
  </div>

  <div id="zone">ZONE 100%</div>

  <div id="crosshair">+</div>

  <div id="message"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div class="buttons">
    <button id="sprint">🏃</button>
    <button id="shoot">🔫</button>
  </div>
</div>

<div id="start">
  <h1>MINI BATTLE ROYALE</h1>
  <p>3D Survival Game</p>
  <button id="play">PLAY</button>
</div>

<div id="gameover">
  <h1 id="result">GAME OVER</h1>
  <p>KILL: <span id="finalKills">0</span></p>
  <button onclick="location.reload()">MAIN LAGI</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script src="script.js"></script>

</body>
</html>
