<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login dengan Google</title>
    <link rel="stylesheet" href="style.css">
    <!-- Script resmi Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="container">
        <h2>Silakan Masuk</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Gunakan akun Google Anda untuk melanjutkan.</p>
        
        <!-- Tempat Tombol Google akan dirender secara otomatis -->
        <div id="buttonDiv" style="display: flex; justify-content: center;"></div>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyB1QM9-RRolInpMhCedGAd9hP4r7NyZJs",
            authDomain: "photobooth-db-27a16.firebaseapp.com",
            projectId: "photobooth-db-27a16",
            storageBucket: "photobooth-db-27a16.firebasestorage.app",
            messagingSenderId: "12884142671",
            appId: "1:12884142671:web:7c92d420a716f1bca8183a",
            measurementId: "G-8CMBTTJMTV"
        };

        // Inisialisasi Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fungsi untuk mendecode data token dari Google
        function decodeJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Fungsi yang dipanggil saat user sukses login dengan Google
        window.handleCredentialResponse = async function(response) {
            const responsePayload = decodeJwtResponse(response.credential);
            
            const userEmail = responsePayload.email;
            const userName = responsePayload.name;
            const userPic = responsePayload.picture;

            try {
                // Simpan atau perbarui data user ke database Firestore secara permanen
                // Menggunakan email sebagai ID dokumen agar tidak duplikat
                await setDoc(doc(db, "users", userEmail), {
                    nama: userName,
                    email: userEmail,
                    foto: userPic,
                    saldo: 0, // Saldo awal atau data permanen lainnya
                    loginTerakhir: serverTimestamp()
                }, { merge: true }); // { merge: true } agar data lama/saldo tidak tereset jika login ulang

                console.log("Data berhasil disimpan ke Firebase!");
            } catch (error) {
                console.error("Gagal menyimpan ke database: ", error);
            }

            // Simpan sesi sementara ke sessionStorage untuk dashboard
            sessionStorage.setItem('userName', userName);
            sessionStorage.setItem('userEmail', userEmail);
            sessionStorage.setItem('userPic', userPic);

            // Arahkan ke halaman Dashboard
            window.location.href = 'dashboard.html';
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "117188803694-660b55kapcmc5undapi96dg8ifh9o9im.apps.googleusercontent.com",
                callback: window.handleCredentialResponse
            });
            
            google.accounts.id.renderButton(
                document.getElementById("buttonDiv"),
                { theme: "outline", size: "large", width: "100%" }
            );
        }
    </script>
</body>
</html>
