<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login dengan Google</title>
    <link rel="stylesheet" href="style.css">
    <!-- Script resmi Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="container">
        <h2>Silakan Masuk</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Gunakan akun Google Anda untuk melanjutkan.</p>
        
        <!-- Tempat Tombol Google akan dirender secara otomatis -->
        <div id="buttonDiv" style="display: flex; justify-content: center;"></div>
    </div>

    <!-- Firebase SDK & Logika Utama -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase baru Anda
        const firebaseConfig = {
            apiKey: "AIzaSyBIkoKjrPOzvA-3jFl_SZV",
            authDomain: "photobooth-v.firebaseapp.com",
            projectId: "photobooth-v",
            storageBucket: "photobooth-v.firebasestorage.app",
            messagingSenderId: "1031549781795",
            appId: "1:1031549781795:web:7cdb9f51",
            measurementId: "G-ZZQJJKJ1BD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function decodeJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Definisikan fungsi secara global agar bisa dipanggil Google API
        window.handleCredentialResponse = async function(response) {
            try {
                const responsePayload = decodeJwtResponse(response.credential);
                
                const userEmail = responsePayload.email;
                const userName = responsePayload.name;
                const userPic = responsePayload.picture;

                // Simpan ke Firestore secara permanen
                await setDoc(doc(db, "users", userEmail), {
                    nama: userName,
                    email: userEmail,
                    foto: userPic,
                    saldo: 0,
                    loginTerakhir: serverTimestamp()
                }, { merge: true });

                // Simpan sesi sementara
                sessionStorage.setItem('userName', userName);
                sessionStorage.setItem('userEmail', userEmail);
                sessionStorage.setItem('userPic', userPic);

                // Langsung lempar ke dashboard tanpa mental
                window.location.href = 'dashboard.html';

            } catch (error) {
                console.error("Error saat login:", error);
                alert("Terjadi kesalahan saat memproses login. Coba lagi.");
            }
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "117188803694-660b55kapcmc5undapi96dg8ifh9o9im.apps.googleusercontent.com",
                callback: window.handleCredentialResponse
            });
            
            google.accounts.id.renderButton(
                document.getElementById("buttonDiv"),
                { theme: "outline", size: "large", width: "100%" }
            );
        }
    </script>
</body>
</html>
