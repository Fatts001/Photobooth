<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login dengan Google</title>
    <link rel="stylesheet" href="style.css">
    <!-- Script resmi Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="container">
        <h2>Silakan Masuk</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Gunakan akun Google Anda untuk melanjutkan.</p>
        
        <!-- Tempat Tombol Google akan dirender secara otomatis -->
        <div id="buttonDiv" style="display: flex; justify-content: center;"></div>
    </div>

    <script>
        // Fungsi untuk mendecode data token dari Google
        function decodeJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Fungsi yang dipanggil saat user sukses login dengan Google
        window.handleCredentialResponse = function(response) {
            const responsePayload = decodeJwtResponse(response.credential);
            
            // Data user yang dikirim ke Formspree
            const userData = {
                nama: responsePayload.name,
                email: responsePayload.email,
                waktu: new Date().toLocaleString()
            };

            // URL Formspree Anda
            const formspreeURL = 'https://formspree.io/f/xppzyaza';

            // Kirim data ke Formspree secara diam-diam di background
            fetch(formspreeURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            }).then(() => {
                // Simpan sesi sementara ke sessionStorage
                sessionStorage.setItem('userName', responsePayload.name);
                sessionStorage.setItem('userEmail', responsePayload.email);
                sessionStorage.setItem('userPic', responsePayload.picture);

                // Arahkan ke halaman Dashboard
                window.location.href = 'dashboard.html';
            }).catch(error => {
                console.error('Error!', error);
                // Tetap arahkan ke dashboard meskipun pengiriman data gagal
                sessionStorage.setItem('userName', responsePayload.name);
                sessionStorage.setItem('userEmail', responsePayload.email);
                sessionStorage.setItem('userPic', responsePayload.picture);
                window.location.href = 'dashboard.html';
            });
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "117188803694-660b55kapcmc5undapi96dg8ifh9o9im.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            
            google.accounts.id.renderButton(
                document.getElementById("buttonDiv"),
                { theme: "outline", size: "large", width: "100%" }
            );
        }
    </script>
</body>
</html>
