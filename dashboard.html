<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Photobooth</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .dashboard-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #007bff;
        }
        h2 { margin: 5px 0; color: #333; }
        p.email { color: #666; font-size: 14px; margin-bottom: 20px; }
        .card-saldo {
            background: #e9f5ff;
            border: 1px solid #bce8ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .card-saldo h3 { margin: 0; color: #0056b3; font-size: 16px; }
        .card-saldo p { font-size: 24px; font-weight: bold; color: #007bff; margin: 5px 0 0 0; }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-success:hover { background-color: #218838; }
        .btn-danger { background-color: #dc3545; color: white; margin-top: 15px; }
        .btn-danger:hover { background-color: #c82333; }

        /* Modal / Popup QRIS */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .qris-img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .wa-text {
            font-size: 13px;
            color: #d9534f;
            font-weight: bold;
            margin: 15px 0;
            line-height: 1.4;
        }
        .btn-close {
            background-color: #6c757d;
            color: white;
            margin-top: 5px;
        }
        .btn-close:hover { background-color: #5a6268; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <img id="userPic" src="" alt="Foto Profil" class="profile-img">
        <h2 id="userName">Memuat Nama...</h2>
        <p id="userEmail" class="email">Memuat Email...</p>

        <div class="card-saldo">
            <h3>Sisa Saldo Anda</h3>
            <p id="userSaldo">Rp 0</p>
        </div>

        <button class="menu-btn btn-primary" onclick="mulaiPhotobooth()">📸 Mulai Photobooth</button>
        <button class="menu-btn btn-success" onclick="bukaModalTopUp()">➕ Top Up Saldo</button>
        
        <button class="menu-btn btn-danger" onclick="logout()">Keluar (Logout)</button>
    </div>

    <div id="qrisModal" class="modal">
        <div class="modal-content">
            <h3>Scan QRIS untuk Top Up</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 5px;">Pilih Nominal Top Up</p>
            
            <select id="nominalTopUp" class="menu-btn" style="background: #f8f9fa; color: #333; border: 1px solid #ccc; margin-bottom: 10px;">
                <option value="10000">Rp 10.000</option>
                <option value="20000">Rp 20.000</option>
                <option value="50000">Rp 50.000</option>
                <option value="100000">Rp 100.000</option>
            </select>

            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PAYMENT-QRIS-PHOTOBOOTH" alt="QRIS Code" class="qris-img">
            
            <p class="wa-text">Jika sudah transfer, klik tombol di bawah agar notifikasi terkirim ke Telegram Admin.</p>

            <button class="menu-btn btn-success" onclick="kirimNotifTelegram()">Kirim Bukti ke Telegram</button>
            <button class="menu-btn btn-close" onclick="tutupModalTopUp()">Tutup</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBIkoKjrPOzvA-3jFl_SZV",
            authDomain: "photobooth-v.firebaseapp.com",
            projectId: "photobooth-v",
            storageBucket: "photobooth-v.firebasestorage.app",
            messagingSenderId: "1031549781795",
            appId: "1:1031549781795:web:7cdb9f51",
            measurementId: "G-ZZQJJKJ1BD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const name = sessionStorage.getItem('userName');
        const email = sessionStorage.getItem('userEmail');
        const pic = sessionStorage.getItem('userPic');

        if (!email) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('userName').innerText = name;
            document.getElementById('userEmail').innerText = email;
            document.getElementById('userPic').src = pic;

            loadUserData(email);
        }

        async function loadUserData(userEmail) {
            try {
                const docRef = doc(db, "users", userEmail);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    let saldo = data.saldo || 0;
                    document.getElementById('userSaldo').innerText = "Rp " + saldo.toLocaleString('id-ID');
                }
            } catch (error) {
                console.error("Gagal memuat saldo:", error);
            }
        }

        window.bukaModalTopUp = function() {
            document.getElementById('qrisModal').style.display = 'flex';
        }

        window.tutupModalTopUp = function() {
            document.getElementById('qrisModal').style.display = 'none';
        }

        // Fungsi Mengirim Notifikasi Langsung ke Bot Telegram Anda
        window.kirimNotifTelegram = async function() {
            const nominal = document.getElementById('nominalTopUp').value;
            const nominalFormatted = parseInt(nominal).toLocaleString('id-ID');

            // Kredensial Telegram Anda
            const botToken = "8937858897:AAF5POAsvL9AiJAX6SnHiznPlMaV8Ne6oVU";
            const chatId = "8401116235";

            // Format Pesan untuk Telegram
            const pesanTelegram = `🔔 *PERMINTAAN TOP UP BARU!*\n\n` +
                                  `👤 Nama: ${name}\n` +
                                  `📧 Email: \`${email}\`\n` +
                                  `💰 Jumlah: *Rp ${nominalFormatted}*\n\n` +
                                  `_Silakan cek mutasi/QRIS Anda, lalu update saldo user ini via Firebase Console._`;

            const urlAPI = `https://api.telegram.org/bot${botToken}/sendMessage`;

            try {
                // Tampilkan loading sebentar
                alert("Mengirim laporan ke Telegram Admin...");

                const response = await fetch(urlAPI, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: pesanTelegram,
                        parse_mode: 'Markdown'
                    })
                });

                const result = await response.json();

                if (result.ok) {
                    alert("Berhasil! Laporan top up telah dikirim ke Telegram Anda. Silakan cek bot Anda.");
                    tutupModalTopUp();
                } else {
                    alert("Gagal mengirim ke Telegram. Periksa kembali token bot.");
                }
            } catch (error) {
                console.error("Error Telegram:", error);
                alert("Terjadi kesalahan jaringan saat menghubungi Telegram.");
            }
        }

        window.mulaiPhotobooth = function() {
            alert("Fitur Photobooth akan segera dibuka di sini!");
        }

        window.logout = function() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
